[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "site-scraper"
version = "0.1.0"
description = "Paste a website URL and save its public content as JSON, Markdown, CSV and Excel, with a live terminal dashboard."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Amon" }]
requires-python = ">=3.9"
keywords = ["web scraping", "crawler", "sitemap", "markdown", "excel", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
    "openpyxl>=3.1",
    "pandas>=1.5",
]

[project.optional-dependencies]
full = [
    "trafilatura>=1.6",
    "extruct>=0.16",
    "pypdf>=3.0",
    "phonenumbers>=8.13",
    "playwright>=1.40",
    "rich>=13.0",
    "truststore>=0.8; python_version >= '3.10'",
]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/AmonHooriLal/Site-Scraper-Main"

[project.scripts]
site-scraper = "site_scraper.cli:main"

[tool.setuptools]
packages = ["site_scraper"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["site_scraper/amon_welcome.py"]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F401", "F403", "F405"]  # modules share imports/helpers through `from .helpers import *`

[tool.pytest.ini_options]
testpaths = ["tests"]
